name: Usak Kesif APK Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix Project Name and Create Android
        run: |
          sed -i 's/name: .*/name: usak_kesif/' pubspec.yaml
          flutter create . --platforms=android --org com.usak.kesif
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Usak-Kesif-APK
          path: build/app/outputs/flutter-apk/app-release.apk
